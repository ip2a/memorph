[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorph-bin-darwin-x64"
version = "0.1.26"
description = "memorph platform package (darwin x64)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memorph_bin_darwin_x64 = ["bin/*"]
