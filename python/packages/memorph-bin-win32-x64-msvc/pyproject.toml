[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorph-bin-win32-x64-msvc"
version = "0.1.6"
description = "memorph platform package (win32 x64 msvc)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memorph_bin_win32_x64_msvc = ["bin/*"]
