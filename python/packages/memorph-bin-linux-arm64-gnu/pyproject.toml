[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorph-bin-linux-arm64-gnu"
version = "0.1.16"
description = "memorph platform package (linux arm64 gnu)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memorph_bin_linux_arm64_gnu = ["bin/*"]
