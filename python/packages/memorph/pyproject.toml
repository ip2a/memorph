[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorph"
version = "0.1.10"
description = "memorph main package; dispatches to a prebuilt platform binary"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "memorph-bin-darwin-arm64==0.1.10; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "memorph-bin-darwin-x64==0.1.10; platform_system == 'Darwin' and platform_machine == 'x86_64'",
  "memorph-bin-linux-x64-gnu==0.1.10; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "memorph-bin-linux-arm64-gnu==0.1.10; platform_system == 'Linux' and platform_machine == 'aarch64'",
  "memorph-bin-win32-x64-msvc==0.1.10; platform_system == 'Windows' and platform_machine == 'AMD64'",
]

[project.scripts]
memorph = "memorph.__main__:main"
memo = "memorph.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
