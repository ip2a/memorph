name: post-release-verify

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to verify (e.g., 0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  verify-github-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download GitHub Release assets
        shell: bash
        run: |
          mkdir -p release-assets
          gh release download "v${{ inputs.version }}" --dir release-assets --pattern '*.tar.gz' --pattern '*.zip' --pattern 'SHA256SUMS.txt'

      - name: Verify GitHub Release asset layout and checksums
        shell: bash
        run: python3 scripts/verify_github_release_assets.py --assets-dir release-assets --version "${{ inputs.version }}"

      - name: Verify GitHub Release provenance
        shell: bash
        run: |
          gh release verify "v${{ inputs.version }}"
          for asset in release-assets/*; do
            gh release verify-asset "v${{ inputs.version }}" "$asset"
          done

  verify-desktop-release:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download desktop release assets
        shell: bash
        run: |
          mkdir -p desktop-release-assets
          gh release download "v${{ inputs.version }}" --dir desktop-release-assets --pattern 'memorph-desktop-v*.dmg' --pattern 'SHA256SUMS-desktop.txt'

      - name: Verify desktop release asset layout and checksums
        shell: bash
        run: python3 scripts/verify_desktop_release_assets.py --assets-dir desktop-release-assets --version "${{ inputs.version }}"

      - name: Verify dmg images
        shell: bash
        run: |
          for asset in desktop-release-assets/*.dmg; do
            hdiutil verify "$asset"
          done

  verify-install-script:
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_id: darwin-arm64
          - os: ubuntu-22.04
            platform_id: linux-x64-gnu
          - os: ubuntu-22.04-arm
            platform_id: linux-arm64-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify cloud install script
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" \
            | VERSION="${{ inputs.version }}" INSTALL_DIR="$RUNNER_TEMP/bin" bash
          "$RUNNER_TEMP/bin/memorph" --version
          "$RUNNER_TEMP/bin/memo" --version

  verify-npm:
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_id: darwin-arm64
          - os: ubuntu-22.04
            platform_id: linux-x64-gnu
          - os: ubuntu-22.04-arm
            platform_id: linux-arm64-gnu
          - os: windows-latest
            platform_id: win32-x64-msvc

    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify npm install
        shell: bash
        run: |
          npm install -g memorph@${{ inputs.version }}
          INSTALLED_VERSION=$(memorph --version)
          echo "Installed version: ${INSTALLED_VERSION}"
          if [[ "${INSTALLED_VERSION}" != *"${{ inputs.version }}"* ]]; then
            echo "[error] Version mismatch: expected ${{ inputs.version }}, got ${INSTALLED_VERSION}"
            exit 1
          fi
          ALIAS_VERSION=$(memo --version)
          echo "Installed alias version: ${ALIAS_VERSION}"
          if [[ "${ALIAS_VERSION}" != *"${{ inputs.version }}"* ]]; then
            echo "[error] Alias version mismatch: expected ${{ inputs.version }}, got ${ALIAS_VERSION}"
            exit 1
          fi
          echo "[ok] npm install verification passed for ${{ matrix.platform_id }}"

  verify-pypi:
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_id: darwin-arm64
          - os: ubuntu-22.04
            platform_id: linux-x64-gnu
          - os: ubuntu-22.04-arm
            platform_id: linux-arm64-gnu
          - os: windows-latest
            platform_id: win32-x64-msvc

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Verify PyPI install
        shell: bash
        run: |
          uv tool install memorph==${{ inputs.version }}
          INSTALLED_VERSION=$(memorph --version)
          echo "Installed version: ${INSTALLED_VERSION}"
          if [[ "${INSTALLED_VERSION}" != *"${{ inputs.version }}"* ]]; then
            echo "[error] Version mismatch: expected ${{ inputs.version }}, got ${INSTALLED_VERSION}"
            exit 1
          fi
          ALIAS_VERSION=$(memo --version)
          echo "Installed alias version: ${ALIAS_VERSION}"
          if [[ "${ALIAS_VERSION}" != *"${{ inputs.version }}"* ]]; then
            echo "[error] Alias version mismatch: expected ${{ inputs.version }}, got ${ALIAS_VERSION}"
            exit 1
          fi
          echo "[ok] PyPI install verification passed for ${{ matrix.platform_id }}"

  verify-crates:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify crates.io install
        shell: bash
        run: |
          cargo install memorph --version ${{ inputs.version }}
          INSTALLED_VERSION=$(memorph --version)
          echo "Installed version: ${INSTALLED_VERSION}"
          if [[ "${INSTALLED_VERSION}" != *"${{ inputs.version }}"* ]]; then
            echo "[error] Version mismatch: expected ${{ inputs.version }}, got ${INSTALLED_VERSION}"
            exit 1
          fi
          ALIAS_VERSION=$(memo --version)
          echo "Installed alias version: ${ALIAS_VERSION}"
          if [[ "${ALIAS_VERSION}" != *"${{ inputs.version }}"* ]]; then
            echo "[error] Alias version mismatch: expected ${{ inputs.version }}, got ${ALIAS_VERSION}"
            exit 1
          fi
          echo "[ok] crates.io install verification passed"
