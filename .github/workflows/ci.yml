name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  rust-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: python3 scripts/release_preflight.py

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Build frontend assets
        run: ./scripts/build_web_assets.sh

      - name: Test release scripts
        run: python3 scripts/test_release_scripts.py

      - name: Test web UI invariants
        run: python3 scripts/test_web_ui_invariants.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify crate package assets
        shell: bash
        run: |
          cargo package --list --allow-dirty --manifest-path rust/crates/memorph/Cargo.toml > cargo-package-files.txt
          grep -Fx "assets/i18n.json" cargo-package-files.txt
          grep -Fx "assets/web/index.html" cargo-package-files.txt
          grep -Fx "src/bin/memorph.rs" cargo-package-files.txt
          grep -Fx "src/bin/memo.rs" cargo-package-files.txt

      - name: Run tests
        run: cargo test --locked --manifest-path rust/Cargo.toml
