name: release-publish-npm

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID of the release-build workflow"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release context
        shell: bash
        run: python3 scripts/validate_release_context.py --build-run-id "${{ inputs.build_run_id }}"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Debug OIDC claims
        run: |
          uv run python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          audience = "npm:registry.npmjs.org"
          request_url = f"{os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']}&audience={audience}"
          request = urllib.request.Request(
              request_url,
              headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          with urllib.request.urlopen(request) as response:
              oidc_token = json.loads(response.read().decode("utf-8"))["value"]

          payload = oidc_token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload).decode("utf-8"))
          fields = [
              "aud",
              "sub",
              "repository",
              "ref",
              "job_workflow_ref",
              "environment",
          ]
          print("[info] OIDC claims used for npm trusted publishing:")
          for field in fields:
              print(f"  {field}: {claims.get(field)}")
          PY

      - name: Validate release metadata
        run: python3 scripts/release_preflight.py

      - name: Download release-build artifacts
        run: |
          mkdir -p dist
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc; do
            gh run download "${{ inputs.build_run_id }}" --name "memorph-${platform}" --dir "dist/${platform}"
          done

      - name: Assemble npm platform packages
        run: uv run python scripts/assemble_npm_packages.py --dist-root dist

      - name: Publish npm platform packages
        run: |
          echo "npm whoami => $(npm whoami || echo '<not logged in>')"
          echo "npm registry => $(npm config get registry)"

      - name: Publish memorph-bin-darwin-arm64
        run: (cd npm/packages/memorph-bin-darwin-arm64 && npm publish --access public --provenance)

      - name: Install Node.js for darwin-x64
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Publish memorph-bin-darwin-x64
        run: (cd npm/packages/memorph-bin-darwin-x64 && npm publish --access public --provenance)

      - name: Install Node.js for linux-x64-gnu
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Publish memorph-bin-linux-x64-gnu
        run: (cd npm/packages/memorph-bin-linux-x64-gnu && npm publish --access public --provenance)

      - name: Install Node.js for linux-arm64-gnu
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Publish memorph-bin-linux-arm64-gnu
        run: (cd npm/packages/memorph-bin-linux-arm64-gnu && npm publish --access public --provenance)

      - name: Install Node.js for win32-x64-msvc
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Publish memorph-bin-win32-x64-msvc
        run: (cd npm/packages/memorph-bin-win32-x64-msvc && npm publish --access public --provenance)

      - name: Install Node.js for main package
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Publish npm main package
        run: (cd npm/packages/memorph && npm publish --access public --provenance)
