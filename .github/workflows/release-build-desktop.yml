name: release-build-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    name: build-desktop-${{ matrix.platform_id }}
    runs-on: ${{ matrix.runner }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TAURI_BUNDLER_DMG_IGNORE_CI: true
      APPLE_SIGNING_IDENTITY: "-"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - platform_id: linux-x64-gnu
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - platform_id: linux-arm64-gnu
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - platform_id: win32-x64-msvc
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release context
        shell: bash
        run: python3 scripts/validate_release_context.py

      - name: Validate release metadata
        shell: bash
        run: python3 scripts/release_preflight.py

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        shell: bash
        run: npm ci --prefix apps/web

      - name: Build frontend assets
        shell: bash
        run: ./scripts/build_web_assets.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux desktop dependencies
        if: startsWith(matrix.platform_id, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            fonts-dejavu \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --locked --version 2.10.1

      - name: Build desktop bundles
        shell: bash
        working-directory: desktop/tauri
        run: cargo tauri build --bundles "${{ matrix.bundles }}" --target "${{ matrix.target }}"

      - name: Inspect desktop bundle outputs
        shell: bash
        run: find desktop/tauri/target -path '*/bundle/*' -type f -print

      - name: Upload desktop bundle outputs
        uses: actions/upload-artifact@v4
        with:
          name: memorph-desktop-${{ matrix.platform_id }}
          path: |
            desktop/tauri/target/${{ matrix.target }}/release/bundle/*/*
            desktop/tauri/target/release/bundle/*/*
          if-no-files-found: error

  publish-desktop-release:
    name: publish-desktop-release
    runs-on: ubuntu-latest
    needs: build-desktop
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release context
        shell: bash
        run: python3 scripts/validate_release_context.py

      - name: Validate release metadata
        shell: bash
        run: python3 scripts/release_preflight.py

      - name: Download desktop bundle outputs
        shell: bash
        run: |
          mkdir -p desktop-bundles
          for platform in darwin-arm64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc; do
            gh run download "${GITHUB_RUN_ID}" \
              --name "memorph-desktop-${platform}" \
              --dir "desktop-bundles/${platform}"
          done

      - name: Prepare desktop release assets
        shell: bash
        run: python3 scripts/prepare_desktop_release_assets.py --target-root desktop-bundles --assets-dir desktop-release-assets

      - name: Verify desktop release assets
        shell: bash
        run: python3 scripts/verify_desktop_release_assets.py --assets-dir desktop-release-assets

      - name: Attest desktop release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: desktop-release-assets/*

      - name: Publish desktop release assets
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            if ! gh release create "${tag}" --title "${tag}" --generate-notes --verify-tag; then
              if gh release view "${tag}" >/dev/null 2>&1; then
                echo "[info] Release ${tag} was created by another workflow"
              else
                exit 1
              fi
            fi
          fi
          gh release upload "${tag}" desktop-release-assets/* --clobber
