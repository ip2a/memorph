name: release-publish-crates

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release context
        shell: bash
        run: python3 scripts/validate_release_context.py

      - name: Validate release metadata
        shell: bash
        run: python3 scripts/release_preflight.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Read crate release version
        id: cargo_meta
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          cargo = tomllib.loads(Path("rust/crates/memorph/Cargo.toml").read_text(encoding="utf-8"))
          print(cargo["package"]["version"])
          PY
          )"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify crate package assets
        shell: bash
        run: |
          cargo package --list --allow-dirty --manifest-path rust/crates/memorph/Cargo.toml > cargo-package-files.txt
          grep -Fx "assets/i18n.json" cargo-package-files.txt
          grep -Fx "src/bin/memorph.rs" cargo-package-files.txt
          grep -Fx "src/bin/memo.rs" cargo-package-files.txt

      - name: Dry-run publish crate
        run: cargo publish --dry-run --allow-dirty --registry crates-io --manifest-path rust/crates/memorph/Cargo.toml

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate to crates.io
        run: cargo publish --registry crates-io --manifest-path rust/crates/memorph/Cargo.toml --token "${{ steps.auth.outputs.token }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Wait for crate on crates.io
        shell: bash
        run: |
          version="${{ steps.cargo_meta.outputs.version }}"
          for attempt in $(seq 1 20); do
            if curl -fsSL "https://crates.io/api/v1/crates/memorph/${version}" >/dev/null; then
              echo "[ok] memorph ${version} is visible on crates.io"
              exit 0
            fi
            echo "[info] Waiting for memorph ${version} to appear on crates.io (attempt ${attempt}/20)"
            sleep 15
          done
          echo "[error] memorph ${version} did not appear on crates.io in time"
          exit 1
