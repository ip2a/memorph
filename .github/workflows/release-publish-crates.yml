name: release-publish-crates

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release context
        shell: bash
        run: python3 scripts/validate_release_context.py

      - name: Validate release metadata
        shell: bash
        run: python3 scripts/release_preflight.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Dry-run publish library
        run: cargo publish --dry-run --manifest-path rust/crates/memorph/Cargo.toml

      - name: Dry-run publish binary
        run: cargo publish --dry-run --manifest-path rust/apps/memorph/Cargo.toml

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish library to crates.io
        run: cargo publish --manifest-path rust/crates/memorph/Cargo.toml --token "${{ steps.auth.outputs.token }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish binary to crates.io
        run: cargo publish --manifest-path rust/apps/memorph/Cargo.toml --token "${{ steps.auth.outputs.token }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
