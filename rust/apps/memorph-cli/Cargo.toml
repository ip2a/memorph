[package]
name = "memorph-cli"
version = "0.1.32"
edition = "2021"
publish = false
description = "memorph CLI - command line, TUI, and web/API server"
default-run = "memorph"

[lib]
name = "memorph_cli"
path = "src/lib.rs"

[[bin]]
name = "memorph"
path = "src/bin/memorph.rs"

[[bin]]
name = "memo"
path = "src/bin/memo.rs"

[dependencies]
memorph = { path = "../../crates/memorph", features = ["test-support"] }
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
open = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
ratatui = "0.29"
crossterm = "0.28"
uuid = { version = "1.16", features = ["v4", "serde"] }
sha2 = "0.10"
walkdir = "2.5"
base64 = "0.22"
tempfile = "3.19"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
flate2 = "1.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
