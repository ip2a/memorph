[package]
name = "memorph"
version = "0.1.32"
edition = "2021"
authors = ["memorph contributors"]
description = "Convert, import, and export AI coding sessions between Claude Code, Codex, and OpenCode"
license = "MIT"
repository = "https://github.com/ip2a/memorph"
readme = "../../../README.md"
keywords = ["ai", "claude", "codex", "opencode", "sessions"]
categories = ["api-bindings"]
include = [
  "assets/i18n.json",
  "src/**",
  "Cargo.toml",
]

[features]
test-support = []

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
rusqlite = { version = "0.39.0", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
tempfile = "3.19"
uuid = { version = "1.16", features = ["v4", "serde"] }
walkdir = "2.5"
rand = "0.8"
base64 = "0.22"
md5 = "0.7"
notify = "7"
flate2 = "1.0"
sha2 = "0.10"
