[package]
name = "memorph"
version = "0.1.31"
edition = "2021"
authors = ["memorph contributors"]
description = "Convert, import, and export AI coding sessions between Claude Code, Codex, and OpenCode"
license = "MIT"
repository = "https://github.com/ip2a/memorph"
readme = "../../../README.md"
keywords = ["cli", "ai", "claude", "codex", "opencode"]
categories = ["command-line-utilities"]
default-run = "memorph"
include = [
  "assets/i18n.json",
  "assets/web/**",
  "build.rs",
  "src/**",
  "Cargo.toml",
]

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
open = "5"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ratatui = "0.29"
crossterm = "0.28"
tempfile = "3.19"
uuid = { version = "1.16", features = ["v4", "serde"] }
walkdir = "2.5"
rand = "0.8"
base64 = "0.22"
md5 = "0.7"
notify = "7"
flate2 = "1.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "memorph"
path = "src/bin/memorph.rs"

[[bin]]
name = "memo"
path = "src/bin/memo.rs"
