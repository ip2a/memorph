[package]
name = "memorph"
version = "0.1.0"
edition = "2021"
authors = ["memorph contributors"]
description = "Convert, import, and export AI coding sessions between Claude Code, Codex, and OpenCode"
license = "MIT"
repository = "https://github.com/whillhill/memorph"
keywords = ["cli", "ai", "claude", "codex", "opencode"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.16", features = ["v4", "serde"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.19"
