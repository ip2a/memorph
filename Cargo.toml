[package]
name = "memorph"
version = "0.1.7"
edition = "2021"
authors = ["memorph contributors"]
description = "Convert, import, and export AI coding sessions between Claude Code, Codex, and OpenCode"
license = "MIT"
repository = "https://github.com/ip2a/memorph"
readme = "README.md"
keywords = ["cli", "ai", "claude", "codex", "opencode"]
categories = ["command-line-utilities"]
exclude = [
  ".github",
  ".gitignore",
  "assets",
  "npm",
  "platforms.toml",
  "python",
  "scripts",
  "README_en.md",
  "README_zh.md",
  "reference-projects",
]

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
maud = "0.26"
open = "5"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
ratatui = "0.29"
crossterm = "0.28"
tempfile = "3.19"
uuid = { version = "1.16", features = ["v4", "serde"] }
walkdir = "2.5"
rand = "0.8"
base64 = "0.22"
