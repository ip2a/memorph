[package]
name = "memorph-tauri"
version = "0.1.21"
edition = "2021"
publish = false

[lib]
name = "memorph_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "memorph-tauri"
path = "src/main.rs"

[dependencies]
memorph = { path = "../../rust/crates/memorph" }
anyhow = "1.0"
axum = "0.8"
dirs = "6.0"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
